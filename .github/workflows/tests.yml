name: Tests and deployment smoke test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser for end-to-end tests
        run: playwright install --with-deps chromium
      - name: Run tests
        run: pytest -q
      - name: Check Python style
        run: ruff check app tests wsgi.py

  deployment-smoke-test:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and start Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl enable --now redis-server.service
          sudo systemctl is-active --quiet redis-server.service
      - name: Install the application with deploy.sh
        run: sudo ./deploy.sh
      - name: Verify the installed unit and network bind
        run: |
          sudo systemctl is-enabled --quiet gmv-one-meal-one-speech.service
          sudo ss -ltn | grep -F '0.0.0.0:8000'
      - name: Verify systemctl stop stops the service
        run: |
          sudo systemctl stop gmv-one-meal-one-speech.service
          if sudo systemctl is-active --quiet gmv-one-meal-one-speech.service; then
            echo "El servicio sigue activo tras systemctl stop." >&2
            exit 1
          fi
          status="$(curl --silent --connect-timeout 2 --max-time 5 \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/health || true)"
          if [[ "$status" == "200" ]]; then
            echo "La API sigue respondiendo después de detener el servicio." >&2
            exit 1
          fi
      - name: Verify systemctl start restores HTTP 200
        run: |
          if ! sudo systemctl start gmv-one-meal-one-speech.service; then
            sudo systemctl status gmv-one-meal-one-speech.service --no-pager >&2 || true
            sudo journalctl -u gmv-one-meal-one-speech.service -n 60 --no-pager >&2 || true
            exit 1
          fi
          for attempt in $(seq 1 30); do
            status="$(curl --silent --connect-timeout 2 --max-time 5 \
              --output "$RUNNER_TEMP/health.json" \
              --write-out '%{http_code}' http://127.0.0.1:8000/api/health || true)"
            if [[ "$status" == "200" ]]; then
              sudo systemctl is-active --quiet gmv-one-meal-one-speech.service
              cat "$RUNNER_TEMP/health.json"
              echo "systemctl stop/start verificado: HTTP 200"
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status gmv-one-meal-one-speech.service --no-pager >&2 || true
          sudo journalctl -u gmv-one-meal-one-speech.service -n 60 --no-pager >&2 || true
          echo "El servicio no recuperó HTTP 200 después de systemctl start." >&2
          exit 1
      - name: Stop the test service
        if: always()
        run: |
          sudo systemctl stop gmv-one-meal-one-speech.service 2>/dev/null || true
